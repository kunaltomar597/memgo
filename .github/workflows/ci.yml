name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hub:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: hub
    steps:
      - uses: actions/checkout@v4
      - name: System packages
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          cache-dependency-glob: hub/uv.lock
      - name: Model pack cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/remu/models
            ~/.local/share/remu-hub/models
          key: remu-models-v1-${{ hashFiles('hub/remu_hub/faces/models.py') }}
      - name: Setup (deps, model pack, fixture video)
        run: make setup
      - name: Lint
        run: make lint
      - name: Typecheck
        run: make typecheck
      - name: Test
        run: make test
      - name: Privacy scan
        if: hashFiles('scripts/privacy_scan.py') != ''
        run: uv run python ../scripts/privacy_scan.py --self-test
