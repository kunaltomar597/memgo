[project]
name = "remu-hub"
version = "0.1.0"
description = "Remu hub: in-shop face recognition for opted-in members"
requires-python = ">=3.11,<3.12"
dependencies = [
  "numpy==2.1.2",
  "opencv-python-headless==4.10.0.84",
  "onnxruntime==1.19.2",
  "fastapi==0.115.2",
  "uvicorn[standard]==0.32.0",
  "httpx==0.27.2",
  "cryptography==43.0.1",
  "argon2-cffi==23.1.0",
  "pydantic==2.9.2",
  "sentry-sdk==2.17.0",
]

[project.optional-dependencies]
dev = [
  "ruff==0.7.0",
  "mypy==1.13.0",
  "pytest==8.3.3",
]

[project.scripts]
remu-hub = "remu_hub.cli:main"

[build-system]
requires = ["hatchling==1.25.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["remu_hub"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF"]
ignore = ["S101", "S603", "S607", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S107", "S108", "S311", "S608"]
"../tests/**" = ["S105", "S106", "S108", "S311", "S608"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["remu_hub"]

[[tool.mypy.overrides]]
module = ["cv2", "cv2.*", "onnxruntime", "onnxruntime.*", "argon2", "argon2.*", "sentry_sdk", "sentry_sdk.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests", "../tests/integration"]
markers = [
  "models: needs the downloaded model pack (skipped when absent)",
  "integration: end-to-end test, runs when REMU_INTEGRATION=1",
]
